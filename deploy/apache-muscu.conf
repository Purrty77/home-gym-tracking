<VirtualHost *:80>
    ServerName muscu.local
    DocumentRoot /var/www/muscu/public
    AddDefaultCharset UTF-8

    <Directory /var/www/muscu/public>
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/muscu-error.log
    CustomLog ${APACHE_LOG_DIR}/muscu-access.log combined
</VirtualHost>
